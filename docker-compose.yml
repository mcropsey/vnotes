# VNotes — deliberately vulnerable API, LAB USE ONLY. Do not expose publicly.
services:
  vnotes:
    build: .
    image: vnotes:latest
    container_name: vnotes
    ports:
      - "8000:8000"
    volumes:
      - vnotes-data:/app/data      # SQLite DB persists here (DB_PATH=/app/data/vnotes.db)
    restart: unless-stopped

volumes:
  vnotes-data:
